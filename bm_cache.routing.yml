# visiting bm_cache config menu, runs this code

bm_cache.settings_form:
  path: '/admin/bm_cache/settings_form'
  defaults:
    _form: '\Drupal\bm_cache\Form\SettingsForm'
    _title: 'BMCache info'
  requirements:
    _permission: 'administer site configuration'

bm_cache.cache_form:
  path: '/admin/flush/bluemarloc_cache_form'
  defaults:
    _form: '\Drupal\bm_cache\BMCacheForm\BMCacheForm'
    _title: 'BMCache flush'
  requirements:
    _permission: 'administer site configuration'
